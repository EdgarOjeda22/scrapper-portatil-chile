name: Sincronizacion Automatica Portatil Chile

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías requeridas
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml

      - name: Ejecutar script de Python
        run: python scraper.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add catalogo_portatil_chile.csv
          git commit -m "Actualizacion automatica de catalogo cada 15 min" || echo "Sin cambios para guardar"
          git push
